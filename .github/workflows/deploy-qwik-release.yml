name: Deploy Qwik website from source release (legacy alias)

# Legacy entry name retained for operators. All release handling lives in
# deploy-single-container-release.yml (qwik-website-release-v1 still accepted).

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'No-op. Use deploy-single-container-release via repository_dispatch.'
        required: false
        default: 'legacy-alias'

permissions:
  contents: read

jobs:
  notice:
    name: Redirect notice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain legacy alias
        run: |
          set -euo pipefail
          cat <<'MSG'
          Qwik production deploys are handled by
          .github/workflows/deploy-single-container-release.yml

          Accepted repository_dispatch types:
            - single-container-web-release-v1 (preferred)
            - qwik-website-release-v1 (legacy alias)

          client_payload.application must equal "qwik-website".
          MSG
